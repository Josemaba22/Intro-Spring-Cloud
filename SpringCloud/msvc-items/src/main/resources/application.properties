spring.application.name=msvc-items
server.port=8002

spring.cloud.discovery.client.simple.instances.mscv-product[0].uri=http://localhost:8001
spring.cloud.discovery.client.simple.instances.mscv-product[1].uri=http://localhost:9001

spring.output.ansi.enabled=ALWAYS
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%-5level) %clr(%logger{36}){cyan} : %clr(%msg){faint}%n